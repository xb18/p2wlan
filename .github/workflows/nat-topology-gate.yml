name: NAT Topology Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/path-state-machine-required.yml"
      - ".github/workflows/nat-topology-gate.yml"
      - "scripts/nat-sim/**"
      - "scripts/diagnostics-auth.sh"
      - "client/nat/**"
      - "client/daemon/**"
      - "client/tun/**"
      - "client/relay/**"
      - "server/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Close same-head network/CI prerequisites; regression checks read the dependency graph.
      - ".github/workflows/**"
      - "client/netbind/**"
      - "client/wireguard/**"
      - "scripts/dplpmtud/**"
      - "docs/reference/networking.md"
      - "scripts/mtu-smoke.sh"
      - "scripts/quality/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nat-topology-gate.yml"
      - "scripts/nat-sim/**"
      - "scripts/diagnostics-auth.sh"
      - "client/nat/**"
      - "client/daemon/**"
      - "client/tun/**"
      - "client/relay/**"
      - "server/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Close same-head network/CI prerequisites; regression checks read the dependency graph.
      - ".github/workflows/**"
      - "client/netbind/**"
      - "client/wireguard/**"
      - "scripts/dplpmtud/**"
      - "docs/reference/networking.md"
      - "scripts/mtu-smoke.sh"
      - "scripts/quality/**"
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      capture_crash:
        description: Capture one original Relay crash without publishing a required gate
        type: boolean
        default: false
      crash_source_sha:
        description: Exact source commit for the diagnostic reproduction
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A commit validation (push / pull_request) and a periodic health check
  # (schedule / workflow_dispatch) are different obligations for the same
  # ref. Sharing one concurrency group let a scheduled run cancel an
  # in-flight commit validation, so each event class gets its own group and
  # only a pull request cancels its own superseded predecessors.
  group: nat-topology-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: NAT simulator unit tests
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.capture_crash }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run simulator parser and unit tests
        run: bash scripts/nat-sim/run-ci-topology.sh unit
      - name: Upload unit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nat-topology-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2wlan-nat-topology-*.log
          if-no-files-found: error
          retention-days: 14

  direct:
    name: Direct cold-start topology
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # The component record is consumed by the exact-head aggregate.
          # Do not let pull_request's synthetic merge ref become its source
          # identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: server/go.mod
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Run deterministic Direct topology
        env:
          NAT_TOPOLOGY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/nat-sim/run-ci-topology.sh direct
      - name: Upload Direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nat-topology-direct-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2wlan-nat-topology-*.log
            ${{ runner.temp }}/p2wlan-nat-topology-*/**
          if-no-files-found: error
          retention-days: 14

  relay:
    name: Relay blackhole topology ${{ matrix.run }}/5
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Pull-request checkout otherwise uses the synthetic merge ref. Each
          # independent Relay run must execute the exact same PR Head tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact Relay topology Head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
          echo "relay_topology_head_sha=$actual_head_sha replica=${{ matrix.run }}/5"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: server/go.mod
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Run deterministic Relay topology
        env:
          NAT_TOPOLOGY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NAT_TOPOLOGY_REPLICA: ${{ matrix.run }}
        run: bash scripts/nat-sim/run-ci-topology.sh relay
      - name: Upload Relay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nat-topology-relay-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.run }}-of-5
          path: |
            ${{ runner.temp }}/p2wlan-nat-topology-*.log
            ${{ runner.temp }}/p2wlan-nat-topology-*/**
          if-no-files-found: error
          retention-days: 14

  fail_closed:
    name: Observability fail-closed injection
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: server/go.mod
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Prove missing status evidence fails closed
        run: bash scripts/nat-sim/run-ci-topology.sh fail-closed
      - name: Upload failure-injection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nat-topology-fail-closed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2wlan-nat-topology-*.log
            ${{ runner.temp }}/p2wlan-nat-topology-*/**
          if-no-files-found: error
          retention-days: 14

  required:
    name: NAT Topology Required
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.capture_crash) }}
    needs: [unit, direct, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact aggregate source head
        id: identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
          workflow_sha="$(git rev-parse "$actual_head_sha:.github/workflows/nat-topology-gate.yml")"
          {
            echo "source_head_sha=$actual_head_sha"
            echo "workflow_sha=$workflow_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Download every Direct attempt of this run
        id: download_direct
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          # Every attempt is fetched so a partial re-run can still be
          # aggregated and so a failing attempt stays available afterwards.
          pattern: nat-topology-direct-${{ github.run_id }}-*
          path: ${{ runner.temp }}/nat-topology-artifacts
          merge-multiple: false

      - name: Download every Relay attempt of this run
        id: download_relay
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nat-topology-relay-${{ github.run_id }}-*-of-5
          path: ${{ runner.temp }}/nat-topology-artifacts
          merge-multiple: false

      - name: Lay out one attempt of evidence per scenario
        id: select
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/nat-sim/select_attempt_evidence.py \
            --artifacts-root "$RUNNER_TEMP/nat-topology-artifacts" \
            --output-root "$RUNNER_TEMP/nat-topology-evidence" \
            --run-id "$GITHUB_RUN_ID" \
            --current-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Build actual-execution NAT aggregate
        id: aggregate
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/nat-sim/aggregate_evidence.py \
            --input-root "$RUNNER_TEMP/nat-topology-evidence" \
            --source-head-sha "${{ steps.identity.outputs.source_head_sha }}" \
            --workflow-sha "${{ steps.identity.outputs.workflow_sha }}" \
            --output "$RUNNER_TEMP/nat-topology-aggregate.json"

      - name: Upload actual-execution NAT aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nat-topology-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nat-topology-aggregate.json
          if-no-files-found: error
          retention-days: 90

  crash_diagnostic:
    name: Original Relay crash diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_crash }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.crash_source_sha }}
          persist-credentials: false
      - name: Verify exact diagnostic source
        env:
          CRASH_SOURCE_SHA: ${{ inputs.crash_source_sha }}
        run: |
          set -euo pipefail
          [[ "$CRASH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CRASH_SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: server/go.mod
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gdb
      - name: Capture one original Relay attempt
        env:
          NAT_TOPOLOGY_HEAD_SHA: ${{ inputs.crash_source_sha }}
          NAT_TOPOLOGY_REPLICA: "2"
        run: |
          set -euo pipefail
          diag_output="$RUNNER_TEMP/nat-crash-diagnostic"
          diag_core_root="$RUNNER_TEMP/nat-crash-cores"
          mkdir "$diag_output" "$diag_core_root"
          diag_old_core_pattern="$(cat /proc/sys/kernel/core_pattern)"
          restore_core_pattern() {
            printf '%s\n' "$diag_old_core_pattern" | sudo tee /proc/sys/kernel/core_pattern >/dev/null
            sudo rm -f "$diag_core_root"/core.*
            rm -f "$diag_core_root"/*.raw.txt
          }
          trap restore_core_pattern EXIT
          # Kernel %P is the global process PID; %s is its terminating signal.
          # Match the recorded launch directly, independent of GDB's optional
          # `info proc` text for a core target.
          sudo sysctl -w "kernel.core_pattern=$diag_core_root/core.%P.%s" >/dev/null
          # Change only core retention; keep the original thread stack,
          # round, connect, business, cancellation and cleanup deadlines.
          ulimit -c unlimited
          set +e
          bash scripts/nat-sim/run-ci-topology.sh relay > "$diag_output/original-attempt.log" 2>&1
          diag_native_exit=$?
          set -e
          printf '%s\n' "$diag_native_exit" > "$diag_output/original-exit-code.txt"
          diag_attempt_root="$RUNNER_TEMP/p2wlan-nat-topology-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-relay-2-attempt-1"
          test -f "$diag_attempt_root/artifact-set.json"
          cp "$diag_attempt_root/artifact-set.json" "$diag_output/"
          cp "$diag_attempt_root/source-at-build.json" "$diag_output/"
          test -f "$diag_attempt_root/round-1/cleanup.json"
          cp "$diag_attempt_root/round-1/cleanup.json" "$diag_output/"
          shopt -s nullglob
          diag_core_count=0
          for diag_core in "$diag_core_root"/core.*; do
            diag_core_count=$((diag_core_count + 1))
            sha256sum "$diag_core" >> "$diag_output/core-hashes.txt"
            gdb --batch --quiet \
              -ex 'set pagination off' \
              -ex 'set print frame-arguments none' \
              -ex 'info proc' \
              -ex 'thread apply all bt 80' \
              "$diag_attempt_root/artifacts/daemon" "$diag_core" \
              > "$diag_core_root/gdb-$diag_core_count.raw.txt" 2> "$diag_output/gdb-$diag_core_count.stderr.txt"
            python3 - "$diag_attempt_root" "$diag_core" "$diag_core_root/gdb-$diag_core_count.raw.txt" "$diag_output/core-owner-$diag_core_count.json" <<'PY'
          import hashlib, json, pathlib, re, sys
          root, core, raw, output = map(pathlib.Path, sys.argv[1:])
          text = raw.read_text(errors="replace")
          kernel_name = re.fullmatch(r"core\.([0-9]+)\.6", core.name)
          assert kernel_name, "kernel global PID and SIGABRT must be recorded"
          pid = int(kernel_name.group(1))
          process = re.search(r"^process ([0-9]+)\s*$", text, re.MULTILINE)
          assert not process or int(process.group(1)) == pid, "core PID sources disagree"
          owners = [json.loads(path.read_text()) for path in (root / "round-1/launches").glob("node-*.json")]
          owner = [record for record in owners if record["pid"] == pid]
          assert len(owner) == 1, "core must belong to exactly one recorded daemon"
          artifact = json.loads((root / "artifact-set.json").read_text())
          digest = hashlib.sha256((root / "artifacts/daemon").read_bytes()).hexdigest()
          assert digest == artifact["artifacts"]["daemon"]["sha256"]
          assert owner[0]["source"] == artifact["source"]
          assert "SIGABRT" in text, "core signal differs from original stack-overflow abort"
          output.write_text(json.dumps({"pid": pid, "pid_source": "kernel.core_pattern.%P", "signal": 6, "role": owner[0]["role"], "source": artifact["source"], "daemon_sha256": digest, "core_owned_daemon_verified": True}, indent=2))
          PY
            # Publish symbols and source locations, never core memory,
            # runtime configuration, authorization or argument values.
            awk '/^Thread / || /^#[0-9]+ /' "$diag_core_root/gdb-$diag_core_count.raw.txt" \
              > "$diag_output/backtrace-$diag_core_count.txt"
            rm -f "$diag_core_root/gdb-$diag_core_count.raw.txt"
          done
          printf '%s\n' "$diag_core_count" > "$diag_output/core-count.txt"
          printf '%s\n' 'diagnostic_only=true' 'required_gate_published=false' > "$diag_output/scope.txt"
          test "$diag_core_count" -gt 0
          # Preserve the original business-validation outcome. A diagnostic
          # reproduction cannot replace the authoritative failing run.
          test "$diag_native_exit" -ne 0
          exit "$diag_native_exit"
      - name: Upload crash symbols and bound identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nat-crash-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nat-crash-diagnostic/**
          if-no-files-found: error
          retention-days: 14

      - name: Enforce required topology results and aggregate
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          DIRECT_RESULT: ${{ needs.direct.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
          DOWNLOAD_DIRECT_OUTCOME: ${{ steps.download_direct.outcome }}
          DOWNLOAD_RELAY_OUTCOME: ${{ steps.download_relay.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          set -euo pipefail
          test "$UNIT_RESULT" = "success"
          test "$DIRECT_RESULT" = "success"
          test "$RELAY_RESULT" = "success"
          test "$DOWNLOAD_DIRECT_OUTCOME" = "success"
          test "$DOWNLOAD_RELAY_OUTCOME" = "success"
          test "$SELECT_OUTCOME" = "success"
          test "$AGGREGATE_OUTCOME" = "success"
          echo "all required NAT topology profiles and actual-execution evidence passed"
